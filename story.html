.art ul.l { display: grid; gap: 0; margin-top: 6px; }

.art ul.l li::before { content: ""; position: absolute; left: 2px; top: 23px; width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); }

.art .pair { display: grid; gap: 12px; }

@media (min-width: 900px) {
  .art { grid-template-columns: 2fr 7fr 3fr; column-gap: 24px; }

  .art blockquote { grid-column: 2 / 4; }

  .art .pair { grid-template-columns: 1fr 1fr; gap: 24px; width: calc(100% * 9 / 12); margin-left: auto; margin-right: auto; }
  .art .wide { width: 100%; }
}
.srcbox { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--ink); display: grid; gap: 8px; color: var(--mute); font-size: 15px; }

<script>
(() => {
  const S = OYS, D = S.D, img = S.img, el = document.getElementById("story");
  const key = new URLSearchParams(location.search).get("s") || "silence", s = D.STORIES[key];
  if (!s) {
    el.innerHTML = `<section class="missing" data-intro><p class="meta" style="color:var(--mute)">Journal</p><h1><span class="line-mask"><span>이 글은 아직</span></span><span class="line-mask"><span>옮기지 않았어요.</span></span></h1><p>사이트로 옮긴 글은 이야기 목록에서, 나머지는 블로그에서 읽을 수 있어요.</p><div class="acts"><a class="ulink" href="journal.html">이야기 목록</a><a class="ulink" href="${D.LINKS.blogHome}">블로그</a></div></section>`;
    S.start(); return;
  }
  document.title = `${s.title} — 오요가`;
  document.querySelector('meta[name="description"]').content = `${s.sub}. ${s.lead}`;
  const canon = document.createElement("link"); canon.rel = "canonical"; canon.href = `https://www.oyoga.kr/story.html?s=${key}`;
  const art = document.createElement("script"); art.type = "application/ld+json";
  art.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "Article", headline: s.title, description: s.sub, datePublished: s.date, inLanguage: "ko-KR",
    image: `https://www.oyoga.kr/${img(s.img)}`, mainEntityOfPage: canon.href, isBasedOn: D.LINKS.blog(s.src),
    author: { "@type": "Organization", name: "오요가", url: "https://www.oyoga.kr/" }, publisher: { "@id": "https://www.oyoga.kr/#business" } });
  document.head.append(canon, art);
  const block = ([t, a, b, c]) => {
    if (t === "h") return `<h2>${a}</h2>`;
    if (t === "p") return `<p class="b">${a}</p>`;
    if (t === "q") return `<blockquote>${a}</blockquote>`;
    if (t === "list") return `<ul class="l">${a.map((x) => `<li>${x}</li>`).join("")}</ul>`;
    if (t === "pair") return `<figure><div class="pair"><div class="ph reveal"><img src="${img(a)}" alt="" loading="lazy" data-par="8"></div><div class="ph reveal"><img src="${img(b)}" alt="" loading="lazy" data-par="8"></div></div><figcaption style="text-align:center">${c}</figcaption></figure>`;
    if (t === "wide") return `<figure class="wide"><div class="ph reveal"><img src="${img(a)}" alt="" loading="lazy" data-par="8"></div><figcaption>${b}</figcaption></figure>`;
    return "";
  };
  const nextK = s.next, isAcademy = nextK === "academy", n = isAcademy ? null : D.STORIES[nextK];
  const next = isAcademy
    ? `<a class="nextup" href="academy.html" data-cursor="보기"><div class="ph reveal"><img src="${img("blog/treepose")}" alt="" loading="lazy" data-par="8"></div><div style="display:grid;gap:12px"><span class="m">이 글의 사진은 2025 제주 지도자 과정에서 찍었어요</span><b>2026 하반기 제주 리트릿 TTC</b><p>11월 8일부터 22일까지, 14박 15일. 침묵과 수련을 함께 살아 보는 시간이에요.</p></div></a>`
    : `<a class="nextup" href="story.html?s=${nextK}" data-cursor="읽기"><div class="ph reveal"><img src="${img(n.img)}" alt="" loading="lazy" data-par="8"></div><div style="display:grid;gap:12px"><span class="m">다음 글</span><b>${n.title}</b><p>${n.lead}</p></div></a>`;
  el.innerHTML = `
    <header class="ah" data-intro>
      <p class="m"><span>${s.cat}</span><span>${S.ymd(s.date)}</span><span>${s.read}분 읽기</span></p>
      <h1><span class="line-mask"><span>${s.title}</span></span></h1>
      <p class="sub">${s.sub}</p>
    </header>
    <figure class="hero-fig"><div class="ph reveal"><img src="${img(s.img)}" alt="" data-par="8"></div><figcaption>${s.cap}</figcaption></figure>
    <div class="art">
      <p class="lead">${s.lead}</p>
      ${s.body.map(block).join("")}
      <div class="srcbox"><span>이 글은 오요가 블로그의 「${s.orig || s.title}」(${S.ymd(s.date)})을 줄여 다시 썼어요.</span><a class="ulink" href="${D.LINKS.blog(s.src)}">블로그 원문</a></div>
    </div>
    <section class="sec" aria-label="이어서 읽기">${next}</section>`;
  S.start();
})();
</script>
